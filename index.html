<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainUp App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #161925;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --text-gold: #f59e0b;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            user-select: none;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #1f1d36, #11101d);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand {
            font-weight: 900;
            font-size: 18px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .balance-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--text-gold);
            font-size: 16px;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            color: #9ca3af;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
            color: white;
            border-color: transparent;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.4);
        }

        .page { display: none; }
        .page.active { display: block; }

        /* Карточка покупки */
        .deposit-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }

        .promo-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .promo-input {
            flex: 1;
            background: #0d0e15;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 10px 12px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }

        .promo-btn {
            background: var(--accent-cyan);
            border: none;
            color: black;
            font-weight: bold;
            padding: 0 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Кастомный ввод Звёзд */
        .custom-stars-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .stars-input-container {
            display: flex;
            align-items: center;
            background: #0d0e15;
            border: 1px solid rgba(6, 182, 212, 0.4);
            border-radius: 12px;
            padding: 0 12px;
        }

        .stars-input-container span {
            font-size: 20px;
            margin-right: 8px;
        }

        .stars-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 0;
            outline: none;
        }

        .stars-calc-preview {
            font-size: 14px;
            color: var(--accent-cyan);
            font-weight: bold;
            text-align: center;
        }

        .buy-stars-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            border: none;
            color: black;
            font-size: 16px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }

        /* Кейсы */
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .case-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .case-card:active { transform: scale(0.97); }
        .case-icon { font-size: 38px; margin-bottom: 8px; }
        .case-title { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .case-price {
            display: inline-block;
            background: rgba(245, 158, 11, 0.2);
            color: var(--text-gold);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Рулетка */
        .roulette-modal {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--accent-purple);
            text-align: center;
            margin-bottom: 20px;
        }

        .roulette-container {
            width: 100%;
            height: 110px;
            overflow: hidden;
            border: 2px solid var(--accent-purple);
            border-radius: 12px;
            position: relative;
            background: #0d0e15;
            margin: 15px 0;
        }

        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-pink);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent-pink);
        }

        .track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            transition: transform 3s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .drop-card {
            width: 85px;
            height: 90px;
            margin: 0 4px;
            background: #1f2438;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }

        .spin-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }
        .spin-btn:disabled { opacity: 0.5; }

        /* Окно выигрыша */
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(13, 14, 21, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .win-card {
            background: linear-gradient(145deg, #1f1b3a, #141324);
            border: 2px solid var(--accent-pink);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.4);
        }

        .win-icon {
            font-size: 70px;
            margin: 10px 0;
            filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
        }

        .win-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .win-item-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-top: 6px;
        }

        .win-coins {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid var(--text-gold);
            border-radius: 20px;
            color: var(--text-gold);
            font-weight: bold;
            font-size: 16px;
        }

        .claim-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: linear-gradient(90deg, #10b981, #059669);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .inv-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 11px;
        }

        .inv-icon { font-size: 26px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="brand">BRAINUP 🚀</div>
        <div class="balance-badge"><span id="bal">0</span> 🪙</div>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cases', event)">📦 Кейсы</button>
        <button class="tab-btn" onclick="switchTab('deposit', event)">⭐ Звёзды</button>
        <button class="tab-btn" onclick="switchTab('inventory', event)">🎒 Инвентарь</button>
    </div>

    <!-- ВКЛАДКА 1: КЕЙСЫ -->
    <div id="cases-page" class="page active">
        <div id="active-case-view" class="roulette-modal" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="current-case-name" style="margin:0;">Название Кейса</h3>
                <button onclick="closeCaseView()" style="background:none; border:none; color:#888; font-size:18px; cursor:pointer;">✖</button>
            </div>
            
            <div class="roulette-container" id="rouletteContainer">
                <div class="pointer"></div>
                <div class="track" id="track"></div>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spinCurrentCase()">Открыть кейс</button>
        </div>

        <div class="cases-grid" id="cases-list"></div>
    </div>

    <!-- ВКЛАДКА 2: ПОПОЛНЕНИЕ И ПРОМОКОДЫ -->
    <div id="deposit-page" class="page">
        <div class="deposit-card">
            <h4 style="margin-top:0; margin-bottom:10px;">🔑 Активация промокода</h4>
            <div class="promo-box">
                <input type="text" id="promoInput" class="promo-input" placeholder="Введи промокод">
                <button class="promo-btn" onclick="applyPromo()">Ввести</button>
            </div>
            <div id="promo-status" style="font-size:12px;"></div>
        </div>

        <div class="deposit-card">
            <h4 style="margin-top:0; margin-bottom:6px;">⭐ Покупка за Telegram Stars</h4>
            <p style="font-size:12px; color:#888; margin-top:0; margin-bottom:12px;">Курс: 1 Звезда = 2 Монеты</p>
            
            <div class="custom-stars-box">
                <div class="stars-input-container">
                    <span>⭐</span>
                    <input type="number" id="customStarsInput" class="stars-input" placeholder="Количество звёзд" min="1" value="10" oninput="calculateCustomCoins()">
                </div>
                <div class="stars-calc-preview" id="starsCalcPreview">Ты получишь: 20 🪙</div>
                <button class="buy-stars-btn" id="payStarsBtn" onclick="buyCustomStars()">ОПЛАТИТЬ ЗВЁЗДАМИ</button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 3: ИНВЕНТАРЬ -->
    <div id="inventory-page" class="page">
        <h4 style="margin-top:0; margin-bottom:15px;">Твои выбитые предметы:</h4>
        <div class="inventory-grid" id="inventory-list">
            <div style="grid-column: span 3; color: #666; font-size: 13px;">Инвентарь пока пуст. Открывай кейсы!</div>
        </div>
    </div>

    <!-- ОКНО ВЫИГРЫША -->
    <div class="win-overlay" id="winModal">
        <div class="win-card">
            <div class="win-title" id="winTitleHeader">ПОБЕДА! 🎉</div>
            <div class="win-icon" id="winIcon">🚽</div>
            <div class="win-item-name" id="winItemName">Skibidi Toilet</div>
            <div class="win-coins" id="winCoinsText">+10 🪙</div>
            <button class="claim-btn" onclick="closeWinModal()">ПОНЯТНО</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        let balance = 0;
        let activePromoBonus = 1;
        let inventory = [];
        let selectedCaseIndex = null;

        function loadData() {
            const savedBal = localStorage.getItem('brainup_balance');
            const savedInv = localStorage.getItem('brainup_inventory');
            const savedBonus = localStorage.getItem('brainup_bonus');

            if (savedBal !== null) balance = parseInt(savedBal, 10);
            if (savedInv !== null) inventory = JSON.parse(savedInv);
            if (savedBonus !== null) activePromoBonus = parseFloat(savedBonus);

            updateBalanceUI();
            renderInventory();
            calculateCustomCoins();
        }

        function saveData() {
            localStorage.setItem('brainup_balance', balance);
            localStorage.setItem('brainup_inventory', JSON.stringify(inventory));
            localStorage.setItem('brainup_bonus', activePromoBonus);
        }

        function updateBalanceUI() {
            document.getElementById('bal').innerText = balance.toLocaleString();
        }

        const cases = [
            { id: 1, name: "Skibidi Starter", price: 9, icon: "🚽", drops: [3, 5, 7, 9, 12, 20, 600], item: "Skibidi Toilet" },
            { id: 2, name: "Mewing Pass", price: 15, icon: "🤫", drops: [3, 5, 7, 9, 15, 30, 600], item: "Chad Jawline" },
            { id: 3, name: "Rizzler Box", price: 25, icon: "😏", drops: [5, 10, 15, 25, 40, 600], item: "W Rizz" },
            { id: 4, name: "Fanum Tax", price: 35, icon: "🍕", drops: [5, 10, 20, 35, 50, 600], item: "Gyatt Pizza" },
            { id: 5, name: "Ohio Mystery", price: 50, icon: "💀", drops: [10, 20, 30, 50, 80, 600], item: "Ohio Boss" },
            { id: 6, name: "Sigma Grind", price: 75, icon: "🗿", drops: [15, 30, 50, 75, 120, 600], item: "Gigachad Status" },
            { id: 7, name: "Grimace Shake", price: 100, icon: "🥤", drops: [20, 40, 70, 100, 150, 600], item: "Sus Purple Shake" },
            { id: 8, name: "Kai Cenat Vault", price: 150, icon: "🔥", drops: [30, 60, 100, 150, 250, 800], item: "AMP Setup" },
            { id: 9, name: "Goofy Ahh Crate", price: 250, icon: "🤪", drops: [50, 100, 180, 250, 400, 1000], item: "Quandale Dingle" },
            { id: 10, name: "Supreme BrainRot", price: 500, icon: "👑", drops: [100, 200, 350, 500, 800, 2500], item: "Golden Skibidi God" }
        ];

        function renderCases() {
            const list = document.getElementById('cases-list');
            list.innerHTML = '';
            cases.forEach((c, idx) => {
                const card = document.createElement('div');
                card.className = 'case-card';
                card.onclick = () => openCaseView(idx);
                card.innerHTML = `
                    <div class="case-icon">${c.icon}</div>
                    <div class="case-title">${c.name}</div>
                    <div class="case-price">${c.price} 🪙</div>
                `;
                list.appendChild(card);
            });
        }

        function switchTab(tab, e) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            if (e && e.target) e.target.classList.add('active');
            document.getElementById(`${tab}-page`).classList.add('active');
        }

        function applyPromo() {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            const status = document.getElementById('promo-status');

            if (code === 'DEVADMIN') {
                balance += 1000000;
                updateBalanceUI();
                saveData();
                status.style.color = '#10b981';
                status.innerText = "✅ Вы получили 1,000,000 монет!";
            } else if (code === 'BRAINUP5') {
                activePromoBonus = 1.05;
                saveData();
                status.style.color = '#10b981';
                status.innerText = "✅ +5% бонус к пополнению активирован!";
                calculateCustomCoins();
            } else {
                status.style.color = '#ef4444';
                status.innerText = "❌ Неверный промокод";
            }
            document.getElementById('promoInput').value = '';
        }

        function calculateCustomCoins() {
            const inputVal = parseInt(document.getElementById('customStarsInput').value, 10) || 0;
            const baseCoins = inputVal * 2;
            const finalCoins = Math.floor(baseCoins * activePromoBonus);
            
            let text = `Ты получишь: ${finalCoins.toLocaleString()} 🪙`;
            if (activePromoBonus > 1) {
                text += ` (+5% бонус!)`;
            }
            document.getElementById('starsCalcPreview').innerText = text;
        }

        // --- ПОКУПКА STARS ЧЕРЕЗ TELEGRAM WEBAPP ---
        function buyCustomStars() {
            const starsCount = parseInt(document.getElementById('customStarsInput').value, 10);
            if (!starsCount || starsCount <= 0) {
                showWinModal("⚠️", "Укажите правильное число звёзд", 0, "ОШИБКА");
                return;
            }

            if (!tg) {
                showWinModal("⚠️", "Запустите приложение внутри Telegram!", 0, "ОШИБКА");
                return;
            }

            // Открываем окно оплаты через Telegram (Invoice)
            // Если вы не подключили сервер, Telegram заставит пройти через нативный диалог оплаты
            if (tg.openInvoice) {
                tg.openInvoice(`https://t.me/invoice/stars_${starsCount}`, (status) => {
                    if (status === 'paid') {
                        const coinsToGet = Math.floor(starsCount * 2 * activePromoBonus);
                        balance += coinsToGet;
                        updateBalanceUI();
                        saveData();
                        showWinModal("⭐", "Оплата успешно прошла!", coinsToGet, "УСПЕШНО");
                    } else {
                        showWinModal("ℹ️", "Оплата не зафиксирована", 0, "ОТМЕНА");
                    }
                });
            } else {
                showWinModal("⚠️", "Ваш клиент Telegram не поддерживает эту функцию", 0, "ОШИБКА");
            }
        }

        function openCaseView(index) {
            selectedCaseIndex = index;
            const c = cases[index];
            document.getElementById('current-case-name').innerText = `${c.icon} ${c.name}`;
            document.getElementById('spinBtn').innerText = `Открыть за ${c.price} 🪙`;
            document.getElementById('active-case-view').style.display = 'block';
            
            const track = document.getElementById('track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            generateTrack(c);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeCaseView() {
            document.getElementById('active-case-view').style.display = 'none';
        }

        function generateTrack(c, targetWinVal = null) {
            const track = document.getElementById('track');
            track.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                let dropVal;
                if (i === 28 && targetWinVal !== null) {
                    dropVal = targetWinVal;
                } else {
                    dropVal = c.drops[Math.floor(Math.random() * c.drops.length)];
                }

                const card = document.createElement('div');
                card.className = 'drop-card';
                card.innerHTML = `<span style="font-size:18px;">${c.icon}</span><span>${dropVal} 🪙</span>`;
                track.appendChild(card);
            }
        }

        function spinCurrentCase() {
            if (selectedCaseIndex === null) return;
            const c = cases[selectedCaseIndex];

            if (balance < c.price) {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                showWinModal("❌", "Недостаточно монет!", 0, "ОШИБКА");
                return;
            }

            balance -= c.price;
            updateBalanceUI();
            saveData();
            
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const winCoins = c.drops[Math.floor(Math.random() * c.drops.length)];
            generateTrack(c, winCoins);

            const track = document.getElementById('track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            const cardWidth = 93;
            const containerWidth = document.getElementById('rouletteContainer').offsetWidth;
            const targetPos = (28 * cardWidth) - (containerWidth / 2) + (cardWidth / 2);

            setTimeout(() => {
                track.style.transition = 'transform 3s cubic-bezier(0.1, 1, 0.1, 1)';
                track.style.transform = `translateX(-${targetPos}px)`;
            }, 50);

            setTimeout(() => {
                spinBtn.disabled = false;
                balance += winCoins;
                updateBalanceUI();

                inventory.push({ icon: c.icon, name: c.item, win: winCoins });
                renderInventory();
                saveData();

                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                
                showWinModal(c.icon, c.item, winCoins, "ВЫИГРЫШ! 🎉");
            }, 3200);
        }

        function showWinModal(icon, name, coins, title = "ПОБЕДА! 🎉") {
            document.getElementById('winTitleHeader').innerText = title;
            document.getElementById('winIcon').innerText = icon;
            document.getElementById('winItemName').innerText = name;
            
            const coinsBox = document.getElementById('winCoinsText');
            if (coins > 0) {
                coinsBox.style.display = 'inline-block';
                coinsBox.innerText = `+${coins.toLocaleString()} 🪙`;
            } else {
                coinsBox.style.display = 'none';
            }

            document.getElementById('winModal').style.display = 'flex';
        }

        function closeWinModal() {
            document.getElementById('winModal').style.display = 'none';
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            if (!inventory || inventory.length === 0) {
                list.innerHTML = '<div style="grid-column: span 3; color: #666; font-size: 13px;">Инвентарь пока пуст. Открывай кейсы!</div>';
                return;
            }
            list.innerHTML = '';
            inventory.slice().reverse().forEach(item => {
                const card = document.createElement('div');
                card.className = 'inv-card';
                card.innerHTML = `
                    <div class="inv-icon">${item.icon}</div>
                    <div style="font-weight:bold;">${item.name}</div>
                    <div style="color:var(--text-gold); font-size:10px; margin-top:2px;">+${item.win} 🪙</div>
                `;
                list.appendChild(card);
            });
        }

        renderCases();
        loadData();
    </script>
</body>
</html>
