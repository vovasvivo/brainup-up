<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainUp App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .balance {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffcc00;
        }
        .roulette-container {
            width: 100%;
            height: 120px;
            overflow: hidden;
            border: 3px solid #ffcc00;
            border-radius: 10px;
            position: relative;
            background: #2a2a2a;
            margin-bottom: 20px;
        }
        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: red;
            z-index: 10;
        }
        .track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            transition: transform 3s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .card {
            width: 90px;
            height: 100px;
            margin: 0 5px;
            background: #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .nothing { border: 2px solid #888; color: #bbb; }
        .common { border: 2px solid #0088cc; color: #0088cc; }
        .legendary { border: 2px solid #ff0055; color: #ff0055; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled {
            background: #555;
        }
    </style>
</head>
<body>
    <h1>BrainUp App 🚀</h1>
    <div class="balance">Баланс: <span id="bal">1000</span> 🪙</div>

    <div class="roulette-container">
        <div class="pointer"></div>
        <div class="track" id="track"></div>
    </div>

    <button id="spinBtn" onclick="spin()">Крутить (100 🪙)</button>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        let balance = 1000;
        const track = document.getElementById('track');
        const spinBtn = document.getElementById('spinBtn');

        const items = [
            { name: "Ничего", class: "nothing", chance: 50 },
            { name: "Common", class: "common", chance: 40 },
            { name: "Legendary", class: "legendary", chance: 10 }
        ];

        function getRandomItem() {
            const rand = Math.random() * 100;
            if (rand < 50) return items[0];
            if (rand < 90) return items[1];
            return items[2];
        }

        function generateTrack() {
            track.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const item = getRandomItem();
                const card = document.createElement('div');
                card.className = `card ${item.class}`;
                card.innerText = item.name;
                track.appendChild(card);
            }
        }

        generateTrack();

        function spin() {
            if (balance < 100) {
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                alert("Недостаточно средств!");
                return;
            }

            balance -= 100;
            document.getElementById('bal').innerText = balance;
            spinBtn.disabled = true;

            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            generateTrack();
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            setTimeout(() => {
                track.style.transition = 'transform 3s cubic-bezier(0.1, 1, 0.1, 1)';
                const moveAmount = 2500 + Math.floor(Math.random() * 80);
                track.style.transform = `translateX(-${moveAmount}px)`;
            }, 50);

            setTimeout(() => {
                spinBtn.disabled = false;
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }, 3200);
        }
    </script>
</body>
</html>
