<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainUp - Telegram Stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 320px;
        }
        button {
            background-color: #2ea6ff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:active {
            background-color: #1a8ad8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>BrainUp Shop</h2>
        <p>Пополнить баланс за Telegram Stars</p>
        <button onclick="buyStars()">Купить 1 Звезду (XTR)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function buyStars() {
            try {
                // Ссылка на твой бэкенд на Render
                const backendUrl = 'https://brainup-up.onrender.com';

                const response = await fetch(`${backendUrl}/api/create-invoice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: 'Пополнение в BrainUp',
                        description: 'Тестовая покупка 1 звезды',
                        amount: 1
                    })
                });

                const data = await response.json();
                
                if (data.invoiceLink) {
                    tg.openInvoice(data.invoiceLink, (status) => {
                        if (status === 'paid') {
                            alert('Оплата прошла успешно!');
                        } else {
                            alert('Оплата была отменена.');
                        }
                    });
                } else {
                    alert('Ошибка: ' + (data.error || 'Не удалось создать инвойс'));
                }
            } catch (err) {
                alert('Ошибка соединения с сервером: ' + err.message);
            }
        }
    </script>
</body>
</html>
